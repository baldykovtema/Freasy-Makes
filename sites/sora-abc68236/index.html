<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7aa7ff">
<title>Сора — погода в стиле аниме</title>
<style>
  :root { --sky1: #7aa7ff; --sky2: #ffc2e2; --ink: #2b2350; --card: #ffffffcc; --line: #ffffff; --pink: #ff6fae; --mint: #45d6b5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--ink); min-width: 320px; overflow-x: hidden;
    background: linear-gradient(180deg, var(--sky1), var(--sky2)); background-attachment: fixed; transition: background 1s; }
  body.night { --sky1: #1b1a4b; --sky2: #5b3a8a; --card: #ffffffd9; }
  body.rain { --sky1: #6b7fa8; --sky2: #b8b3d6; }
  body.snow { --sky1: #a9c8f0; --sky2: #eef3ff; }
  body.storm { --sky1: #3d3f66; --sky2: #8b7ca8; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; width: min(1080px, calc(100% - 28px)); margin-inline: auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; flex-wrap: wrap; }
  .logo { font-weight: 900; font-size: 26px; letter-spacing: -.02em; color: #fff; text-shadow: 3px 3px 0 var(--pink), 0 4px 18px #0003; }
  .logo small { font-size: 14px; font-weight: 700; margin-left: 6px; text-shadow: none; opacity: .9; }
  .search { display: flex; gap: 8px; flex: 1 1 320px; max-width: 520px; }
  .search input { flex: 1; min-width: 0; height: 46px; padding: 0 16px; border-radius: 100px; border: 3px solid #fff; background: #ffffffe6; font: inherit; font-size: 16px; color: var(--ink); outline: none; box-shadow: 0 6px 0 #0000001a; }
  .search input:focus { border-color: var(--pink); }
  .btn { height: 46px; padding: 0 18px; border-radius: 100px; border: 3px solid #fff; background: var(--pink); color: #fff; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 6px 0 #c2457f; transition: transform .1s, box-shadow .1s; white-space: nowrap; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c2457f; }
  .btn.mint { background: var(--mint); box-shadow: 0 6px 0 #2a9e83; }
  .btn.mint:active { box-shadow: 0 2px 0 #2a9e83; }
  .suggest { position: absolute; z-index: 5; margin-top: 52px; width: min(520px, calc(100% - 28px)); background: #fff; border-radius: 18px; box-shadow: 0 16px 40px #0003; overflow: hidden; }
  .suggest[hidden] { display: none; }
  .suggest button { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; background: none; font: inherit; cursor: pointer; color: var(--ink); }
  .suggest button:hover { background: #ffe3f0; }
  .suggest small { color: #8a83a8; }

  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: center; margin-top: 8px; }
  .panel { background: var(--card); border: 4px solid var(--line); border-radius: 28px; padding: 22px; box-shadow: 0 10px 0 #00000014, 0 20px 50px #0000001f; backdrop-filter: blur(6px); }
  .place { font-size: 15px; font-weight: 800; color: var(--pink); letter-spacing: .04em; text-transform: uppercase; }
  .temp { font-size: clamp(64px, 12vw, 104px); font-weight: 900; line-height: 1; letter-spacing: -.04em; margin: 6px 0; }
  .temp sup { font-size: .4em; vertical-align: top; }
  .desc { font-size: 22px; font-weight: 800; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .fact { background: #fff; border-radius: 16px; padding: 10px; text-align: center; font-size: 13px; color: #6c6590; }
  .fact b { display: block; font-size: 18px; color: var(--ink); }
  .note { margin-top: 12px; font-size: 13px; color: #6c6590; min-height: 18px; }

  .mascot { position: relative; text-align: center; }
  .bubble { position: relative; display: inline-block; max-width: 340px; background: #fff; border: 4px solid var(--ink); border-radius: 24px; padding: 14px 18px; font-weight: 800; font-size: 17px; line-height: 1.35; box-shadow: 0 6px 0 #0000001a; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -18px; margin-left: -12px; border: 12px solid transparent; border-top-color: var(--ink); }
  #girl { width: min(320px, 80%); height: auto; display: block; margin: 14px auto 0; filter: drop-shadow(0 12px 0 #00000018); animation: bob 3s ease-in-out infinite; cursor: pointer; }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  h2 { color: #fff; font-size: 26px; margin: 30px 0 12px; text-shadow: 2px 2px 0 var(--pink); }
  .hours { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x mandatory; }
  .hour { flex: 0 0 82px; scroll-snap-align: start; background: var(--card); border: 3px solid #fff; border-radius: 20px; padding: 10px 6px; text-align: center; font-weight: 800; }
  .hour .i { font-size: 28px; margin: 4px 0; }
  .hour small { display: block; color: #6c6590; font-weight: 700; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day { background: var(--card); border: 3px solid #fff; border-radius: 22px; padding: 14px 8px; text-align: center; cursor: pointer; transition: transform .15s; }
  .day:hover, .day.on { transform: translateY(-5px); border-color: var(--pink); }
  .day .name { font-weight: 900; }
  .day .i { font-size: 34px; margin: 6px 0; }
  .day .t { font-weight: 800; } .day .t span { color: #8a83a8; font-weight: 700; }
  .day small { display: block; color: #6c6590; margin-top: 4px; }
  .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tip { background: var(--card); border: 3px solid #fff; border-radius: 22px; padding: 16px; }
  .tip b { display: block; font-size: 17px; margin-bottom: 4px; }
  .tip span { color: #5d5682; font-size: 15px; }
  footer { margin: 34px 0 26px; color: #fff; font-weight: 700; font-size: 14px; text-align: center; text-shadow: 0 1px 4px #0004; }
  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; } .mascot { order: -1; }
    .days { grid-template-columns: repeat(4, 1fr); } .tips { grid-template-columns: 1fr; } .facts { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) { .days { grid-template-columns: repeat(2, 1fr); } .search .btn.mint span { display: none; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="logo">Сора ☁️<small>погода с характером</small></div>
    <form class="search" id="form" autocomplete="off">
      <input id="q" placeholder="Город, например Белград" aria-label="Город">
      <button class="btn" type="submit">Найти</button>
      <button class="btn mint" type="button" id="geo" title="Моё местоположение">📍<span> Я тут</span></button>
    </form>
    <div class="suggest" id="suggest" hidden></div>
  </header>

  <section class="hero">
    <div class="panel">
      <div class="place" id="place">—</div>
      <div class="temp" id="temp">--<sup>°C</sup></div>
      <div class="desc" id="desc">Загружаю небо…</div>
      <div class="facts">
        <div class="fact">Ощущается<b id="feel">—</b></div>
        <div class="fact">Ветер<b id="wind">—</b></div>
        <div class="fact">Влажность<b id="hum">—</b></div>
        <div class="fact">Осадки<b id="rainp">—</b></div>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div class="mascot">
      <div class="bubble" id="say">Привет! Я Сора, твоя погодная помощница ✨</div>
      <svg id="girl" viewBox="0 0 300 330" role="img" aria-label="Сора"></svg>
    </div>
  </section>

  <h2>По часам</h2>
  <div class="hours" id="hours"></div>

  <h2>На неделю</h2>
  <div class="days" id="days"></div>

  <h2>Советы Соры</h2>
  <div class="tips" id="tips"></div>

  <footer>Данные о погоде: Open-Meteo · Нажми на Сору — она что-нибудь скажет 💬</footer>
</div>

<script>
'use strict';
// ---------- коды погоды WMO → вид ----------
const W = (code) => {
  if (code === 0) return { t: 'Ясно', i: '☀️', k: 'sun' };
  if (code <= 2) return { t: 'Переменная облачность', i: '⛅', k: 'cloud' };
  if (code === 3) return { t: 'Пасмурно', i: '☁️', k: 'cloud' };
  if (code <= 48) return { t: 'Туман', i: '🌫️', k: 'fog' };
  if (code <= 57) return { t: 'Морось', i: '🌦️', k: 'rain' };
  if (code <= 67) return { t: 'Дождь', i: '🌧️', k: 'rain' };
  if (code <= 77) return { t: 'Снег', i: '❄️', k: 'snow' };
  if (code <= 82) return { t: 'Ливень', i: '🌧️', k: 'rain' };
  if (code <= 86) return { t: 'Снегопад', i: '🌨️', k: 'snow' };
  return { t: 'Гроза', i: '⛈️', k: 'storm' };
};
const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- Сора (SVG) ----------
function drawGirl(kind, night) {
  const outfit = { sun: '#ffd25a', cloud: '#9fb7ff', fog: '#c9c3e6', rain: '#ffe15a', snow: '#ff9ec7', storm: '#7d6bd6' }[kind];
  const mouth = kind === 'storm' ? '<path d="M138 196 q12 -8 24 0" stroke="#5a2b46" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : kind === 'rain' || kind === 'fog' ? '<ellipse cx="150" cy="196" rx="7" ry="5" fill="#5a2b46"/>'
    : '<path d="M136 190 q14 16 28 0" stroke="#5a2b46" stroke-width="4" fill="#ff8fb3" stroke-linecap="round"/>';
  const eyes = night
    ? '<path d="M104 166 q14 10 28 0 M168 166 q14 10 28 0" stroke="#3a2a6a" stroke-width="5" fill="none" stroke-linecap="round"/>'
    : `<g><ellipse cx="118" cy="164" rx="15" ry="19" fill="#3a2a6a"/><ellipse cx="182" cy="164" rx="15" ry="19" fill="#3a2a6a"/>
       <ellipse cx="118" cy="168" rx="9" ry="12" fill="#6f5bd8"/><ellipse cx="182" cy="168" rx="9" ry="12" fill="#6f5bd8"/>
       <circle cx="112" cy="157" r="6" fill="#fff"/><circle cx="176" cy="157" r="6" fill="#fff"/><circle cx="123" cy="172" r="3" fill="#fff"/><circle cx="187" cy="172" r="3" fill="#fff"/></g>`;
  const extra = {
    sun: '<g transform="translate(150 70)"><ellipse rx="92" ry="16" fill="#f6d38a"/><path d="M-50 0 q50 -70 100 0" fill="#f6d38a"/><path d="M-50 -6 h100" stroke="#ff6fae" stroke-width="8"/></g>',
    rain: '<g><path d="M150 330 L150 250" stroke="#7a5a3a" stroke-width="5"/><path d="M60 40 q90 -70 180 0 z" fill="#ff6fae" transform="translate(0 -18)"/><path d="M150 -10 v12" stroke="#7a5a3a" stroke-width="5"/></g>',
    snow: '<g><path d="M90 236 q60 22 120 0 l-6 22 q-54 18 -108 0 z" fill="#ff6fae"/><rect x="188" y="238" width="18" height="44" rx="6" fill="#ff6fae"/><circle cx="150" cy="58" r="16" fill="#fff"/><path d="M92 90 q58 -66 116 0" fill="#ff9ec7"/></g>',
    storm: '<path d="M228 40 l-22 40 h18 l-16 36 40 -50 h-18 l14 -26 z" fill="#ffe15a" stroke="#3a2a6a" stroke-width="3"/>',
    cloud: '<g fill="#fff" opacity=".95"><circle cx="236" cy="66" r="18"/><circle cx="258" cy="70" r="14"/><circle cx="218" cy="74" r="12"/></g>',
    fog: '<g stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"><path d="M30 260 h90"/><path d="M180 280 h90"/></g>',
  }[kind];
  $('girl').innerHTML = `
    <path d="M70 150 q-20 120 30 170 h100 q50 -50 30 -170 z" fill="#5b4bb3"/>
    <path d="M86 250 q64 40 128 0 l14 80 h-156 z" fill="${outfit}" stroke="#3a2a6a" stroke-width="4"/>
    <path d="M128 244 l22 22 22 -22" fill="#fff" stroke="#3a2a6a" stroke-width="3"/>
    <circle cx="150" cy="160" r="78" fill="#ffe6d6" stroke="#3a2a6a" stroke-width="4"/>
    <path d="M70 150 q10 -90 80 -92 q72 2 82 92 q-20 -40 -40 -46 q-10 26 -40 30 q12 -18 6 -34 q-30 30 -88 50 z" fill="#6f5bd8" stroke="#3a2a6a" stroke-width="4"/>
    <path d="M72 150 q-14 60 6 110" stroke="#6f5bd8" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M228 150 q14 60 -6 110" stroke="#6f5bd8" stroke-width="16" fill="none" stroke-linecap="round"/>
    ${eyes}
    <ellipse cx="100" cy="192" rx="12" ry="7" fill="#ff9ec7" opacity=".7"/><ellipse cx="200" cy="192" rx="12" ry="7" fill="#ff9ec7" opacity=".7"/>
    ${mouth}
    <g transform="translate(214 96) rotate(20)"><path d="M0 0 l10 -18 10 18 -10 6 z" fill="#ff6fae" stroke="#3a2a6a" stroke-width="3"/></g>
    ${extra}`;
}

const LINES = {
  sun: ['Солнышко! Идеальный день для прогулки ☀️', 'Не забудь солнцезащитные очки, сэмпай! 😎', 'Сегодня небо улыбается — и ты улыбнись!'],
  cloud: ['Облачка плывут, как в аниме-заставке ☁️', 'Без солнца, но и без дождя — неплохо!', 'Возьми лёгкую кофту, на всякий случай.'],
  fog: ['Туман… прямо как в загадочной серии 🌫️', 'Осторожно на дорогах, видно плохо!', 'Идеальная погода для мистических историй.'],
  rain: ['Кап-кап! Возьми зонтик ☔', 'Дождь — повод выпить тёплый чай дома 🍵', 'Не забудь непромокаемую обувь!'],
  snow: ['Снег! Можно лепить снеговика ⛄', 'Надень шарф и варежки, а то замёрзнешь!', 'Снежинки — как блёстки в финальной сцене ✨'],
  storm: ['Гроза! Лучше остаться дома ⚡', 'Держись подальше от высоких деревьев!', 'Сегодня небо сердится… переждём вместе.'],
};
let lineIndex = 0, current = 'sun';
function speak(next) {
  const list = LINES[current];
  lineIndex = next ? (lineIndex + 1) % list.length : 0;
  $('say').textContent = list[lineIndex];
}
$('girl').addEventListener('click', () => { speak(true); ping(); });

// Короткий «пиу» на клик по Соре.
let audio;
function ping() {
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.setValueAtTime(660, audio.currentTime); o.frequency.exponentialRampToValueAtTime(1320, audio.currentTime + .12);
    g.gain.setValueAtTime(.06, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .2);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .2);
  } catch {}
}

// ---------- эффекты на фоне ----------
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [], fxKind = 'sun', flash = 0;
function resize() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();
function spawn(kind) {
  fxKind = kind; parts = [];
  const n = kind === 'rain' || kind === 'storm' ? 140 : kind === 'snow' ? 90 : 28;
  for (let i = 0; i < n; i++) parts.push({ x: Math.random(), y: Math.random(), s: .5 + Math.random(), r: Math.random() * 6.28 });
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame() {
  const w = fx.width, h = fx.height, d = devicePixelRatio;
  ctx.clearRect(0, 0, w, h);
  for (const p of parts) {
    if (fxKind === 'rain' || fxKind === 'storm') {
      p.y += .018 * p.s; p.x -= .002;
      ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5 * d;
      ctx.beginPath(); ctx.moveTo(p.x * w, p.y * h); ctx.lineTo(p.x * w - 4 * d, p.y * h + 16 * d * p.s); ctx.stroke();
    } else if (fxKind === 'snow') {
      p.y += .002 * p.s; p.x += Math.sin(p.y * 12 + p.r) * .0008;
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 2.6 * d * p.s, 0, 6.28); ctx.fill();
    } else {
      // лепестки сакуры и звёздочки
      p.y += .0012 * p.s; p.x += .0006; p.r += .03;
      ctx.save(); ctx.translate(p.x * w, p.y * h); ctx.rotate(p.r); ctx.fillStyle = fxKind === 'fog' ? '#ffffff55' : '#ffb6d5cc';
      ctx.beginPath(); ctx.ellipse(0, 0, 7 * d * p.s, 4 * d * p.s, 0, 0, 6.28); ctx.fill(); ctx.restore();
    }
    if (p.y > 1.05) { p.y = -.05; p.x = Math.random() * 1.1; }
    if (p.x > 1.05) p.x = -.05;
  }
  if (fxKind === 'storm') {
    if (Math.random() < .004) flash = 1;
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .5})`; ctx.fillRect(0, 0, w, h); flash -= .05; }
  }
  if (!reduce) requestAnimationFrame(frame);
}
spawn('sun'); requestAnimationFrame(frame);

// ---------- данные ----------
function demo() {
  // Без интернета показываем пример, чтобы сайт всё равно было видно.
  const now = new Date(), hours = [], days = [];
  for (let i = 0; i < 24; i++) hours.push({ time: new Date(now.getTime() + i * 3600e3), temp: 14 + Math.round(5 * Math.sin(i / 4)), code: [0, 1, 2, 61, 3, 0][i % 6], rain: (i * 7) % 60 });
  for (let i = 0; i < 7; i++) days.push({ date: new Date(now.getTime() + i * 864e5), max: 18 + (i % 3), min: 9 + (i % 2), code: [0, 2, 61, 3, 71, 95, 1][i], rain: [5, 20, 80, 30, 60, 90, 10][i] });
  return { place: 'Демо-город', current: { temp: 16, feel: 15, wind: 3, hum: 62, code: 1, rain: 10, day: now.getHours() > 6 && now.getHours() < 20 }, hours, days, demo: true };
}

async function load(lat, lon, place) {
  $('desc').textContent = 'Смотрю на небо…';
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7&wind_speed_unit=ms`;
    const r = await fetch(url);
    if (!r.ok) throw new Error();
    const d = await r.json();
    const nowIdx = Math.max(0, d.hourly.time.findIndex((t) => t >= d.current.time.slice(0, 13)));
    const data = {
      place,
      current: { temp: d.current.temperature_2m, feel: d.current.apparent_temperature, wind: d.current.wind_speed_10m, hum: d.current.relative_humidity_2m, code: d.current.weather_code, rain: d.current.precipitation_probability ?? d.hourly.precipitation_probability[nowIdx], day: !!d.current.is_day },
      hours: d.hourly.time.slice(nowIdx, nowIdx + 24).map((t, i) => ({ time: new Date(t), temp: d.hourly.temperature_2m[nowIdx + i], code: d.hourly.weather_code[nowIdx + i], rain: d.hourly.precipitation_probability[nowIdx + i] })),
      days: d.daily.time.map((t, i) => ({ date: new Date(t), max: d.daily.temperature_2m_max[i], min: d.daily.temperature_2m_min[i], code: d.daily.weather_code[i], rain: d.daily.precipitation_probability_max[i] })),
    };
    store.set('sora-place', { lat, lon, place });
    render(data);
  } catch {
    render({ ...demo(), place: place + ' (нет связи — пример)' });
  }
}

function render(data) {
  const c = data.current, w = W(c.code);
  current = w.k;
  document.body.className = [!c.day ? 'night' : '', ['rain', 'snow', 'storm'].includes(w.k) ? w.k : ''].join(' ').trim();
  $('place').textContent = '📍 ' + data.place;
  $('temp').innerHTML = `${Math.round(c.temp)}<sup>°C</sup>`;
  $('desc').textContent = `${w.i} ${w.t}`;
  $('feel').textContent = `${Math.round(c.feel)}°`;
  $('wind').textContent = `${Math.round(c.wind)} м/с`;
  $('hum').textContent = `${Math.round(c.hum)}%`;
  $('rainp').textContent = c.rain == null ? '—' : `${Math.round(c.rain)}%`;
  $('note').textContent = data.demo ? 'Нет интернета — показываю пример прогноза.' : `Обновлено в ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`;
  drawGirl(w.k, !c.day); speak(false); spawn(w.k);

  $('hours').innerHTML = data.hours.map((h) => `<div class="hour"><small>${h.time.getHours().toString().padStart(2, '0')}:00</small><div class="i">${W(h.code).i}</div>${Math.round(h.temp)}°<small>💧${Math.round(h.rain ?? 0)}%</small></div>`).join('');
  $('days').innerHTML = data.days.map((d, i) => `<div class="day${i === 0 ? ' on' : ''}" tabindex="0" data-i="${i}"><div class="name">${i === 0 ? 'Сегодня' : DAYS[d.date.getDay()]}</div><div class="i">${W(d.code).i}</div><div class="t">${Math.round(d.max)}° <span>${Math.round(d.min)}°</span></div><small>💧${Math.round(d.rain ?? 0)}%</small></div>`).join('');
  $('days').querySelectorAll('.day').forEach((el) => {
    const pick = () => {
      $('days').querySelectorAll('.day').forEach((x) => x.classList.toggle('on', x === el));
      const d = data.days[+el.dataset.i], k = W(d.code);
      $('say').textContent = `${el.querySelector('.name').textContent}: ${k.t.toLowerCase()}, до ${Math.round(d.max)}°. ${LINES[k.k][0]}`;
    };
    el.addEventListener('click', pick); el.addEventListener('keydown', (e) => { if (e.key === 'Enter') pick(); });
  });

  const t = c.temp;
  const clothes = t >= 25 ? 'Футболка и шорты — жарко!' : t >= 15 ? 'Лёгкая куртка или худи.' : t >= 5 ? 'Тёплая куртка и шапка.' : 'Пуховик, шарф и варежки!';
  const rainToday = Math.max(c.rain ?? 0, data.days[0]?.rain ?? 0);
  const umbrella = rainToday >= 40 ||['rain', 'storm'].includes(w.k) ? 'Да, возьми зонт ☔' : 'Сегодня можно без зонта 🌂';
  const walk = w.k === 'storm' ? 'Лучше переждать дома.' : w.k === 'sun' && t > 10 ? 'Отличный день для прогулки в парке!' : 'Короткая прогулка — самое то.';
  $('tips').innerHTML = [['👕 Что надеть', clothes], ['☔ Нужен ли зонт', umbrella], ['🌸 Прогулка', walk]].map(([a, b]) => `<div class="tip"><b>${a}</b><span>${b}</span></div>`).join('');
}

// ---------- поиск города ----------
let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  const q = $('q').value.trim();
  if (q.length < 2) { $('suggest').hidden = true; return; }
  timer = setTimeout(() => findCity(q, false), 300);
});
$('form').addEventListener('submit', (e) => { e.preventDefault(); const q = $('q').value.trim(); if (q) findCity(q, true); });
document.addEventListener('click', (e) => { if (!e.target.closest('.search, .suggest')) $('suggest').hidden = true; });
async function findCity(q, first) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ru`);
    const list = (await r.json()).results || [];
    if (!list.length) { $('say').textContent = `Не нашла «${q}» 😿 Попробуй по-другому.`; $('suggest').hidden = true; return; }
    if (first) { choose(list[0]); return; }
    const box = $('suggest');
    box.innerHTML = '';
    for (const c of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `${c.name} <small>${[c.admin1, c.country].filter(Boolean).join(', ')}</small>`;
      b.onclick = () => choose(c);
      box.appendChild(b);
    }
    box.hidden = false;
  } catch { $('say').textContent = 'Нет связи с небом… Проверь интернет 📡'; }
}
function choose(c) { $('suggest').hidden = true; $('q').value = c.name; load(c.latitude, c.longitude, [c.name, c.country].filter(Boolean).join(', ')); }

$('geo').addEventListener('click', () => {
  if (!navigator.geolocation) { $('say').textContent = 'Браузер не умеет определять место 😿'; return; }
  $('say').textContent = 'Ищу тебя на карте… 🔍';
  navigator.geolocation.getCurrentPosition(
    (p) => load(p.coords.latitude, p.coords.longitude, 'Ты здесь'),
    () => { $('say').textContent = 'Не получилось узнать место. Введи город вручную!'; });
});

const saved = store.get('sora-place');
if (saved) load(saved.lat, saved.lon, saved.place); else load(44.79, 20.45, 'Белград, Сербия');
</script>
