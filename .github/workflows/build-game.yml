name: build-game

on:
  repository_dispatch:
    types: [build-game]

permissions:
  contents: read

env:
  JOB_ID: ${{ github.event.client_payload.job_id }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r worker/requirements.txt
      - id: generate
        run: python worker/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

  build:
    needs: generate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python worker/package.py prepare ${{ matrix.format }}

      - name: Windows
        if: matrix.format == 'exe'
        working-directory: ${{ runner.temp }}/freasy/windows
        run: |
          npx --yes @neutralinojs/neu@11.8.0 update
          npx --yes @neutralinojs/neu@11.8.0 build --embed-resources

      - name: macOS
        if: matrix.format == 'dmg'
        run: bash worker/build_macos.sh "$RUNNER_TEMP/freasy/macos"

      - name: Java
        if: matrix.format == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android
        if: matrix.format == 'apk'
        working-directory: ${{ runner.temp }}/freasy/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - run: python worker/package.py deliver ${{ matrix.format }}

  finish:
    needs: [generate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 worker/finish.py
